apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-web-app
  labels:
    app: profile-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profile-app
  template:
    metadata:
      labels:
        app: profile-app
    spec:
      containers:
      - name: profile-container
        image: your-dockerhub-username/personal-profile:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
spec:
  type: NodePort
  selector:
    app: profile-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
